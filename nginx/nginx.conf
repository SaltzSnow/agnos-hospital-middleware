worker_processes auto;
error_log /dev/stderr crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_status 429;
    upstream middleware { server api:8080; }
    server {
        listen 80;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        error_page 403 = @method_not_allowed;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        error_page 502 503 504 = @unavailable;
        location ~ ^/staff/(create|login)$ {
            limit_except POST { deny all; }
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://middleware;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location = /patient/search {
            limit_except POST { deny all; }
            proxy_pass http://middleware;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location ~ ^/(healthz|readyz)$ {
            limit_except GET { deny all; }
            proxy_pass http://middleware;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location @method_not_allowed { return 405 '{"error":{"code":"method_not_allowed","message":"Method not allowed"}}'; }
        location @too_large { return 413 '{"error":{"code":"request_too_large","message":"Request body is too large"}}'; }
        location @rate_limited { return 429 '{"error":{"code":"rate_limited","message":"Too many requests"}}'; }
        location @unavailable { return 502 '{"error":{"code":"unavailable","message":"Service is temporarily unavailable"}}'; }
        location / { return 404 '{"error":{"code":"not_found","message":"Route not found"}}'; }
    }
}

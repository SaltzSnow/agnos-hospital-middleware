name: agnos-assignment
services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://agnos:${POSTGRES_PASSWORD:?Run make setup first}@db:5432/agnos?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Run make setup first}
      REGISTRATION_KEY: ${REGISTRATION_KEY:?Run make setup first}
      PORT: "8080"
      HIS_A_BASE_URL: http://mockhis:8080/a
      HIS_B_BASE_URL: http://mockhis:8080/b
      HIS_TIMEOUT: 3s
    depends_on:
      db:
        condition: service_healthy
      mockhis:
        condition: service_started
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  mockhis:
    build:
      context: .
      target: runtime
    entrypoint: ["/usr/local/bin/mockhis"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: agnos
      POSTGRES_DB: agnos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes:
      - database:/var/lib/postgresql
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./seed/demo.sql:/docker-entrypoint-initdb.d/002-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnos -d agnos"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://agnos:${POSTGRES_PASSWORD:?Run make setup first}@db:5432/agnos?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  database:
